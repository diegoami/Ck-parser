name: Wiki

# Builds the static wikis from the saves attached to this repository's Releases
# and publishes them to GitHub Pages. The saves are not in git, so the job
# fetches and checksums them first (scripts/fetch_saves.sh).
#
# One chronicle per playthrough: saves are grouped by run, so attaching a save
# from a different game adds a chronicle without touching this file.
#
# ONE-TIME SETUP, and it cannot be automated: a repository ADMIN must set
# Settings -> Pages -> Build and deployment -> Source to "GitHub Actions".
# Until then this workflow builds the site and then fails at configure-pages
# with "Get Pages site failed ... Not Found".
#
# `enablement: true` on configure-pages was tried and does not work here:
# creating a Pages site needs admin rights, and GITHUB_TOKEN tops out at write,
# so it fails with "Resource not accessible by integration" instead. Only a
# personal access token with admin rights, or the settings page, can do it.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/fetch_saves.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      title:
        description: "Force every chronicle onto one title (default: each run's own)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --group dev
      - name: Fetch the saves from Releases
        run: scripts/fetch_saves.sh saves
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build the wikis
        # No --title: each run's chronicle is about its own played character's
        # primary title. Saves are grouped into runs automatically, so a save
        # from a new playthrough becomes a new chronicle with no config change.
        run: |
          uv run python -m ck3wiki.build saves --out site \
            ${{ inputs.title && format('--title {0}', inputs.title) || '' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
