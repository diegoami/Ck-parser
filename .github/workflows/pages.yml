name: Wiki

# Builds the static wiki from the saves attached to this repository's Releases
# and publishes it to GitHub Pages. The saves are not in git, so the job fetches
# and checksums them first (scripts/fetch_saves.sh).
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Without that this workflow builds but cannot deploy.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/fetch_saves.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      title:
        description: "Title key to build the wiki around"
        default: e_germany

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --group dev
      - name: Fetch the saves from Releases
        run: scripts/fetch_saves.sh saves
      - name: Build the wiki
        run: |
          uv run python -m ck3wiki.build saves \
            --title "${{ inputs.title || 'e_germany' }}" \
            --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
