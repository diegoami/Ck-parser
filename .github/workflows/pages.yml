name: Wiki

# Builds the static wikis from the saves attached to this repository's Releases
# and publishes them to GitHub Pages. The saves are not in git, so the job
# fetches and checksums them first (scripts/fetch_saves.sh).
#
# One chronicle per playthrough: saves are grouped by run, so attaching a save
# from a different game adds a chronicle without touching this file.
#
# Pages does not need enabling by hand: configure-pages is asked to enable it,
# which it can because this job holds `pages: write`.
#
# Portraits and coats of arms come from the same place, attached to a Release by
# the companion project. They are optional: every image is linked by a derived
# name whether or not the file exists, so a build with none still publishes and
# the missing slots say so.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/fetch_saves.sh"
      - "scripts/fetch_portraits.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      title:
        description: "Force every chronicle onto one title (default: each run's own)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --group dev
      - name: Fetch the saves from Releases
        run: scripts/fetch_saves.sh saves
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Fetch whatever portraits have been harvested
        # The companion project attaches the images it has captured to a
        # Release; anything not there yet simply renders as awaiting harvest,
        # so this never fails the build.
        run: scripts/fetch_portraits.sh portraits
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build the wikis
        # No --title: each run's chronicle is about its own played character's
        # primary title. Saves are grouped into runs automatically, so a save
        # from a new playthrough becomes a new chronicle with no config change.
        run: |
          uv run python -m ck3wiki.build saves --out site --portraits portraits \
            ${{ inputs.title && format('--title {0}', inputs.title) || '' }}
      - uses: actions/configure-pages@v5
        # Turns Pages on if it is not already, rather than failing with
        # "Get Pages site failed". The job has `pages: write`, so it can, and
        # it means publishing needs no setting changed by hand.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
